[project]
name = "sepsis-ml"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.0",
    "numpy>=2.5.3",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "streamlit>=1.65.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
